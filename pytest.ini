[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
filterwarnings =
    # Starlette's own TestClient deprecation notice about httpx — not our code,
    # and switching test clients is out of scope for the test suite itself.
    ignore::DeprecationWarning:starlette.testclient
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
