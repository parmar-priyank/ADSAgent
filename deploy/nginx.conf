# Nginx site config for ADS Agent
# Place at: /etc/nginx/sites-available/adsagent
# Then: sudo ln -s /etc/nginx/sites-available/adsagent /etc/nginx/sites-enabled/adsagent

# Rate limiting zone — shared across all worker processes
# 10 MB zone holds ~160,000 IP states; 20 req/s per IP
limit_req_zone $binary_remote_addr zone=adsagent_ratelimit:10m rate=20r/s;

# Redirect all plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_OR_IP;

    # Let Certbot handle ACME challenges for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN_OR_IP;

    # --- SSL certificates (managed by Certbot) ---
    # Run: sudo certbot --nginx -d YOUR_DOMAIN
    # Certbot will update these paths automatically.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern SSL settings
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS — tells browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Upload size limit (match MAX_UPLOAD_BYTES in config.py = 200 MB) ---
    client_max_body_size 210M;

    # --- Timeouts for large file uploads and long AI processing ---
    proxy_read_timeout    180s;
    proxy_send_timeout    180s;
    proxy_connect_timeout  10s;
    send_timeout          180s;

    # --- Rate limiting: burst of 30 allows short spikes, then 20 req/s steady ---
    limit_req zone=adsagent_ratelimit burst=30 nodelay;
    limit_req_status 429;

    # --- Static files served directly by Nginx (fast, no Python overhead) ---
    location /static/ {
        alias /var/www/adsagent/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Proxy everything else to Gunicorn via Unix socket ---
    location / {
        proxy_pass         http://unix:/run/adsagent/gunicorn.sock;
        proxy_http_version 1.1;

        # Required headers so FastAPI knows the real client IP and protocol
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses
        proxy_buffering    off;
        proxy_cache        off;
    }

    # --- Block common attack paths ---
    location ~* \.(env|git|sql|bak|sh|py)$ {
        deny all;
        return 404;
    }

    # --- Custom error pages ---
    error_page 429 /429.html;
    error_page 502 503 504 /50x.html;
    location = /429.html { root /usr/share/nginx/html; internal; }
    location = /50x.html { root /usr/share/nginx/html; internal; }
}
