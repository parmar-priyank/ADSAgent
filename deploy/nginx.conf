# Nginx site config for ADS Agent
# Place at: /etc/nginx/sites-available/adsagent
# Then: sudo ln -s /etc/nginx/sites-available/adsagent /etc/nginx/sites-enabled/adsagent

# Rate limiting zone — 20 requests/sec per IP, 10 MB tracking table
limit_req_zone $binary_remote_addr zone=adsagent_ratelimit:10m rate=20r/s;

# -----------------------------------------------------------------------
# Gzip compression — reduces HTML/CSS/JS/JSON transfer size by ~70%
# -----------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    text/xml
    application/xml
    image/svg+xml;

# -----------------------------------------------------------------------
# HTTP server — works with a public IP (no domain needed)
# When you get a domain, run: sudo certbot --nginx -d yourdomain.com
# Certbot will automatically upgrade this to HTTPS.
# -----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name 165.245.225.190;

    # --- Upload size limit (matches MAX_UPLOAD_BYTES = 200 MB in config.py) ---
    client_max_body_size 210M;

    # --- Buffer tuning ---
    # Large headers: checklist tokens, long cookies
    large_client_header_buffers 4 32k;
    client_body_buffer_size     128k;
    # Proxy response buffering ON — Nginx absorbs the full response from Gunicorn
    # so the worker is freed immediately even on slow clients
    proxy_buffer_size       16k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;
    # For large file downloads (xlsx/zip), allow temp files on disk
    proxy_max_temp_file_size 1024m;

    # --- Timeouts ---
    proxy_read_timeout    330s;
    proxy_send_timeout    330s;
    proxy_connect_timeout  10s;
    send_timeout          330s;
    keepalive_timeout      65s;

    # --- Security headers ---
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection        "1; mode=block"                    always;

    # --- Rate limiting ---
    limit_req zone=adsagent_ratelimit burst=30 nodelay;
    limit_req_status 429;

    # --- Static files served directly by Nginx (fast, bypasses Python) ---
    location /static/ {
        alias /var/www/adsagent/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Serve pre-compressed .gz files if browser supports it
        gzip_static on;
    }

    # --- Proxy everything else to Gunicorn via Unix socket ---
    location / {
        proxy_pass         http://unix:/run/adsagent/gunicorn.sock;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Buffering ON: Nginx holds response, frees Gunicorn worker faster
        proxy_buffering on;
        proxy_cache     off;
    }

    # --- Block common attack paths ---
    location ~* \.(env|git|sql|bak|sh|py)$ {
        deny all;
        return 404;
    }

    # --- Error pages ---
    error_page 429 /429.html;
    error_page 502 503 504 /50x.html;
    location = /429.html { root /usr/share/nginx/html; internal; }
    location = /50x.html { root /usr/share/nginx/html; internal; }
}

