<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Solar Agreement Extractor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="login-bg"><div class="login-bg-overlay"></div></div>

  <div class="login-split">

    <!-- LEFT: hero -->
    <div class="login-hero">

      <div class="login-nav">
        <div class="login-hero-brand">
          <div class="login-brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
            </svg>
          </div>
          <span class="login-brand-name">Solar Extractor</span>
        </div>
      </div>

      <div class="login-hero-center">
        <div class="login-hero-badge">
          <span class="login-hero-dot"></span>
          Utility prices have steadily increased
        </div>
        <h1 class="login-hero-title">Energy Saving<br>Renewable Solar</h1>
        <p class="login-hero-sub">We have become a preferred partner to leading solar companies, retailers, and commodity companies.</p>
      </div>

      <!-- Realistic wind turbine SVG -->
      <div class="login-windmill-wrap">
        <svg class="login-windmill" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Tower: narrow trapezoid, wide at bottom -->
          <polygon
            points="93,92 107,92 114,295 86,295"
            fill="rgba(220,225,235,.30)"
          />
          <!-- Ground base -->
          <ellipse cx="100" cy="295" rx="28" ry="7" fill="rgba(255,255,255,.12)"/>

          <!-- Nacelle (housing at top of tower) -->
          <rect x="86" y="80" width="28" height="14" rx="4"
            fill="rgba(220,225,235,.55)"/>

          <!-- Hub -->
          <circle cx="100" cy="88" r="6" fill="rgba(240,242,248,.80)"/>

          <!-- Spinning blades group — transform-origin at hub centre -->
          <g class="windmill-blades">
            <!-- Blade 1: points straight up -->
            <path d="M100 88 C97 78, 95 50, 100 10 C105 50, 103 78, 100 88Z"
              fill="rgba(230,235,245,.70)"/>
            <!-- Blade 2: rotated 120° -->
            <path d="M100 88 C97 78, 95 50, 100 10 C105 50, 103 78, 100 88Z"
              fill="rgba(230,235,245,.60)"
              transform="rotate(120 100 88)"/>
            <!-- Blade 3: rotated 240° -->
            <path d="M100 88 C97 78, 95 50, 100 10 C105 50, 103 78, 100 88Z"
              fill="rgba(230,235,245,.60)"
              transform="rotate(240 100 88)"/>
          </g>

          <!-- Hub overlay on top of blades -->
          <circle cx="100" cy="88" r="5" fill="rgba(245,166,35,.95)"/>
        </svg>
      </div>

    </div>

    <!-- RIGHT: transparent panel -->
    <div class="login-panel">
      <div class="login-card">

        <div class="login-logo blue-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>

        <h1>Welcome back</h1>
        <p>Sign in to your user portal</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <div class="login-field">
            <label>Username</label>
            <input type="text" name="username" id="username" required autofocus placeholder="Enter your username">
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password" minlength="8">
          </div>
          <button type="submit" class="login-btn blue-btn">Sign In</button>
        </form>

      </div>
    </div>

  </div>
</body>
</html>
