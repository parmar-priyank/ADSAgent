<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Solar Agreement Extractor</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/login.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <div class="login-bg">
    <video class="login-bg-video" autoplay muted loop playsinline preload="auto">
      <source src="/static/video/bg.mp4" type="video/mp4">
    </video>
    <div class="login-bg-overlay"></div>
  </div>

  <div class="login-split">

    <!-- LEFT: hero -->
    <div class="login-hero">


      <div class="login-hero-center">
        <div class="login-hero-badge">
          <span class="login-hero-dot"></span>
          Utility prices have steadily increased
        </div>
        <h1 class="login-hero-title">Energy Saving<br>Renewable Solar</h1>
        <p class="login-hero-sub">We have become a preferred partner to leading solar companies, retailers, and commodity companies.</p>
      </div>


    </div>

    <!-- RIGHT: transparent panel -->
    <div class="login-panel">
      <div class="login-card">

        <div class="login-logo blue-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>

        <h1>Welcome back</h1>
        <p>Sign in to your user portal</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <div class="login-field">
            <label>Username</label>
            <input type="text" name="username" id="username" required autofocus placeholder="Enter your username">
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter your password" minlength="8">
          </div>
          <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}" style="margin-bottom:14px;"></div>
          <button type="submit" class="login-btn blue-btn">Sign In</button>
          <div style="text-align:center;margin-top:14px;">
            <a href="/forgot-password?via=user" style="font-size:12px;color:#c45010;text-decoration:none;font-weight:600;opacity:.8;">
              Forgot password?
            </a>
          </div>
        </form>

      </div>
    </div>

  </div>
</body>
</html>
