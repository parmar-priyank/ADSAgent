{% extends "user_base.html" %}

{% block title %}Done{% endblock %}

{% block content %}
<div class="user-upload-wrap">
  <div style="text-align:center;max-width:440px;">

    <!-- Success icon -->
    <div style="width:72px;height:72px;border-radius:50%;
                background:rgba(34,197,94,.12);border:2px solid rgba(34,197,94,.3);
                display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#22c55e"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div style="font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.03em;margin-bottom:8px;">
      QC Confirmed
    </div>
    <div style="font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:28px;">
      The checklist has been saved and the installation date has been added to the admin calendar.
    </div>

    <!-- Actions -->
    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;">
      <a href="/user_home"
         style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
                background:var(--brand);color:#fff;text-decoration:none;
                border-radius:10px;padding:12px 24px;font-size:14px;font-weight:700;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Upload New Agreement
      </a>
      <a href="/user/history"
         style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
                background:var(--surface3);border:1px solid var(--line2);color:var(--ink2);
                text-decoration:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:600;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        View My History
      </a>
    </div>

  </div>
</div>
{% endblock %}
