<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>{% block title %}Solar Extractor{% endblock %} — Solar Extractor</title>
  <link rel="stylesheet" href="/static/base.css?v=4">
  <link rel="stylesheet" href="/static/home.css?v=4">
</head>
<body>

  <!-- Fixed top navbar -->
  <div class="home-topbar">
    <div class="home-topbar-inner">

      <!-- Brand -->
      <div class="home-nav-brand">
        <div class="home-nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4
                     M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
          </svg>
        </div>
        <div>
          <div class="home-nav-brand-name">Solar Extractor</div>
          <div class="home-nav-brand-sub">Agreement Portal</div>
        </div>
      </div>

      <!-- Right actions only — no centre page title -->
      <div class="home-nav-actions">

        {% block nav_back %}{% endblock %}

        <a href="/user/history" class="home-nav-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          History
        </a>

        {% if current_user and current_user.role == 'admin' %}
        <a href="/admin" class="home-nav-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Admin
        </a>
        {% endif %}

        <!-- Theme toggle -->
        <form action="/toggle-theme" method="post" style="display:inline;margin:0;" id="theme-toggle-form">
          <input type="hidden" name="next" id="theme-next-input" value="">
          <button type="submit" class="theme-toggle" title="Toggle light/dark mode">
            {% if theme == "dark" %}
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>
            </svg>
            {% else %}
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            {% endif %}
          </button>
        </form>

        <div class="home-nav-divider"></div>

        <!-- User pill -->
        <div class="home-nav-user-pill">
          <div class="home-nav-user-avatar">{{ current_user.username[0]|upper }}</div>
          <span class="home-nav-user-name">{{ current_user.username }}</span>
        </div>

        <!-- Sign out -->
        <a href="/logout" class="home-nav-btn danger">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </a>
      </div>
    </div>
  </div>

  <!-- Page content -->
  <div style="padding-top:62px;">
    {% block content %}{% endblock %}
  </div>

  {% block scripts %}{% endblock %}
  <script>
    // Set on page load so it always reflects the current GET URL, never a POST URL.
    document.getElementById('theme-next-input').value = window.location.href;
  </script>
</body>
</html>
