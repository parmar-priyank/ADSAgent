<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — Solar Agreement Extractor</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/login.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

  <div class="login-bg">
    <video class="login-bg-video" autoplay muted loop playsinline preload="auto">
      <source src="/static/video/bg.mp4" type="video/mp4">
    </video>
    <div class="login-bg-overlay"></div>
  </div>

  <div class="login-split">

    <!-- LEFT: hero -->
    <div class="login-hero">


      <div class="login-hero-center">
        <img src="/static/img/ads-solar-logo.jpeg" alt="ADS Solar" style="height:56px;width:auto;margin-bottom:20px;">
        <h1 class="login-hero-title">Energy Saving<br>Renewable Solar</h1>
        <p class="login-hero-sub">We have become a preferred partner to leading solar companies, retailers, and commodity companies.</p>
      </div>


    </div>

    <!-- RIGHT: transparent panel — admin identity -->
    <div class="login-panel">
      <div class="login-card admin-card">

        <div class="login-logo admin-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>

        <h1>Admin Access</h1>
        <p>Restricted to authorised administrators</p>

        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/admin-dashboard">
          <div class="login-field">
            <label>Username</label>
            <input type="text" name="username" id="username" required autofocus placeholder="Enter admin username">
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password" minlength="8">
          </div>
          <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}" style="margin-bottom:14px;"></div>
          <button type="submit" class="login-btn admin-btn">Sign In as Admin</button>
          <div style="text-align:center;margin-top:14px;">
            <a href="/forgot-password?via=admin" style="font-size:12px;color:#c45010;text-decoration:none;font-weight:600;opacity:.8;">
              Forgot password?
            </a>
          </div>
        </form>

      </div>
    </div>

  </div>
</body>
</html>
