<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Solar Agreement Extractor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Admin Login</h1>
      <p>Solar Agreement Extractor</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/admin-dashboard">
        <div class="login-field">
          <label>Username</label>
          <input type="text" name="username" required autofocus placeholder="Enter admin username">
        </div>
        <div class="login-field">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Enter password" minlength="8">
        </div>
        <button type="submit" class="login-btn">Sign In as Admin</button>
      </form>

    </div>
  </div>
</body>
</html>
