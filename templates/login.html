<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Solar Agreement Extractor</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 4px 24px var(--shadow);
      padding: 48px 40px 40px;
      width: 100%;
      max-width: 380px;
    }
    .login-logo {
      width: 52px; height: 52px;
      background: var(--brand);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin: 0 auto 20px;
    }
    .login-card h1 {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--ink);
    }
    .login-card p {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }
    .login-field { margin-bottom: 16px; }
    .login-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .login-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--ink);
    }
    .login-field input:focus {
      outline: none;
      border-color: var(--brand);
    }
    .login-btn {
      width: 100%;
      padding: 11px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .login-btn:hover { background: var(--brand-dark); }
    .login-error {
      background: #fcf2f0;
      border: 1px solid #f0d4ce;
      color: #b4321f;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">&#9728;</div>
      <h1>Solar Agreement Extractor</h1>
      <p>Sign in to continue</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="login-field">
          <label>Username</label>
          <input type="text" name="username" required autofocus placeholder="Enter username">
        </div>
        <div class="login-field">
          <label>Password</label>
          <input type="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
