<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Solar Agreement Extractor</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-logo">&#9728;</div>
    <h1 class="portal-title">Solar Agreement Extractor</h1>
    <p class="portal-sub">Choose how you'd like to sign in</p>

    <div class="portal-cards">

      <a href="/login/admin" class="portal-card">
        <div class="portal-card-icon orange">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="portal-card-label">Admin</div>
        <div class="portal-card-hint">Manage users, records &amp; templates</div>
        <div class="portal-card-arrow">&rarr;</div>
      </a>

      <a href="/login/user" class="portal-card">
        <div class="portal-card-icon slate">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="portal-card-label">User</div>
        <div class="portal-card-hint">Upload &amp; extract solar agreements</div>
        <div class="portal-card-arrow">&rarr;</div>
      </a>

    </div>
  </div>
</body>
</html>
